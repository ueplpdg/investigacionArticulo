<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="./config.js"></script>
<script src="./ejemplos.js"></script>
<script src="./control.js"></script>
<style>html,body{margin:0;background:#f3f4f8;color:#0a1a3a;font-family:'IBM Plex Sans',sans-serif}a{color:#2456b8}a:hover{color:#163a80}input,select,button{font-family:inherit}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column">
<div style="background:#0a1a3a;color:#fff;border-bottom:5px solid #f6d43a;padding:12px clamp(14px,3vw,32px);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
<div style="display:flex;gap:12px;align-items:center"><img src="escudo-providencia.png" alt="Escudo" style="height:48px"><div style="display:flex;flex-direction:column;gap:2px"><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;color:#f6d43a;font-weight:700">TOMAR EL CONTROL DE LA CLASE</div><div style="font-family:'Archivo Black',sans-serif;font-size:22px">Modo explicación · 8vo y 3ro BGU</div></div></div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<select value="{{ curso }}" onChange="{{ setCurso }}" style="font-size:16px;padding:9px 10px;border-radius:8px;border:2px solid #f6d43a"><option value="8">8vo · Reto Tinkercad</option><option value="3">3ro BGU · Artículo</option></select>
<input type="password" value="{{ clave }}" onChange="{{ setClave }}" placeholder="Clave docente" style="font-size:16px;padding:9px 10px;border-radius:8px;border:2px solid #c9d2e8;width:140px">
<button onClick="{{ toggle }}" style="background:{{ tBg }};color:{{ tCol }};border:2px solid #f6d43a;border-radius:8px;font-family:'Archivo Black',sans-serif;font-size:16px;padding:10px 16px;cursor:pointer;white-space:nowrap">{{ tTxt }}</button>
</div>
</div>
<div style="padding:8px clamp(14px,3vw,32px);font-size:14px;color:{{ msgCol }};background:#fff;border-bottom:2px solid #d6dbe8">{{ msg }}</div>
<div style="flex:1">{{ vista }}</div>
<div style="padding:12px clamp(14px,3vw,32px);background:#fff;border-top:2px solid #d6dbe8;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center">
<button onClick="{{ prev }}" style="background:#fff;color:#14306b;border:2px solid #14306b;border-radius:8px;font-family:'Archivo Black',sans-serif;font-size:16px;padding:10px 18px;cursor:pointer">◀ Anterior</button>
<sc-for list="{{ nums }}" as="b" hint-placeholder-count="7"><button onClick="{{ b.go }}" style="width:38px;height:38px;border-radius:19px;border:2px solid #14306b;background:{{ b.bg }};color:{{ b.col }};font-weight:700;cursor:pointer">{{ b.n }}</button></sc-for>
<button onClick="{{ next }}" style="background:#14306b;color:#fff;border:none;border-radius:8px;font-family:'Archivo Black',sans-serif;font-size:16px;padding:10px 18px;cursor:pointer">Siguiente ▶</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { curso: '8', clave: '', on: false, i: 0, msg: 'Elija el curso, escriba su clave y pulse «Tomar el control». Las pantallas de los estudiantes cambian en unos 3 segundos.', err: false };
  componentDidMount() { try { const c = localStorage.getItem('ctl_clave'); if (c) this.setState({ clave: c }); } catch (e) {} this.leer(); }
  async leer(c) { const u = window.CONTROL && window.CONTROL.url(); if (!u) { this.setState({ msg: 'Falta la dirección de su hoja (sheetsUrl) en config.js.', err: true }); return; }
    try { const r = await fetch(u + '?clase=' + (c || this.state.curso) + '&t=' + Date.now()); const x = await r.json(); this.setState({ on: !!x.on, i: Number(x.i) || 0 }); } catch (e) {} }
  async enviar(o) { const u = window.CONTROL && window.CONTROL.url(), s = this.state; if (!u) return; if (!s.clave) { this.setState({ msg: 'Escriba su clave docente.', err: true }); return; }
    try { localStorage.setItem('ctl_clave', s.clave); } catch (e) {}
    this.setState(Object.assign({}, o, { err: false, msg: o.on === false ? 'Explicación terminada: los estudiantes vuelven a su trabajo.' : 'Controlando las pantallas de ' + (s.curso === '8' ? '8vo' : '3ro BGU') + '. Avance con los botones de abajo.' }));
    try { await fetch(u, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ modo: 'clase', curso: s.curso, clave: s.clave }, o)) }); } catch (e) { this.setState({ msg: 'No se pudo enviar. Revise el internet.', err: true }); } }
  renderVals() {
    const s = this.state, tot = window.CONTROL ? window.CONTROL.total(s.curso) : 0, go = i => { const n = Math.max(0, Math.min(tot - 1, i)); this.enviar({ i: n }); };
    return {
      curso: s.curso, setCurso: e => { const c = e.target.value; this.setState({ curso: c, i: 0, on: false }); this.leer(c); }, clave: s.clave, setClave: e => this.setState({ clave: e.target.value }),
      toggle: () => this.enviar(s.on ? { on: false } : { on: true, i: s.i }), tTxt: s.on ? '■ Terminar la explicación' : '▶ Tomar el control', tBg: s.on ? '#f6d43a' : 'transparent', tCol: s.on ? '#0a1a3a' : '#f6d43a',
      msg: s.msg, msgCol: s.err ? '#b3261e' : '#525d78',
      vista: window.CONTROL ? React.createElement('div', { dangerouslySetInnerHTML: { __html: window.CONTROL.html(s.curso, s.i, true) } }) : null,
      prev: () => go(s.i - 1), next: () => go(s.i + 1),
      nums: Array.from({ length: tot }, (_, k) => ({ n: String(k + 1), go: () => go(k), bg: k === s.i ? '#14306b' : '#fff', col: k === s.i ? '#fff' : '#14306b' }))
    };
  }
}
</script>
</body>
</html>
